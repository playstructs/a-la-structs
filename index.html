      <h1>À la Structs</h1>
      <p><strong>Run a cozy critter restaurant. Out-serve the rivals across town.</strong></p>
      <p>À la Structs is a free 3D browser game and a restaurant-themed skin for Structs. Your animal staff run the kitchen: the Chef discovers recipes, the Sous Chef turns them into gold, and a sign spinner draws in the crowd. When you're ready, send your crew across town as customers for a service challenge against a rival restaurant.</p>
      <ul>
        <li>Pick a critter and name your restaurant</li>
        <li>Play the offline demo kitchen against computer rivals</li>
        <li>Or open for real and join a Structs guild</li>
      </ul>
      <p>The game runs in your browser with WebGL. Please turn on JavaScript to play.</p>
