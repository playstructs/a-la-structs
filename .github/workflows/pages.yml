name: Deploy to GitHub Pages

on:
  push: { branches: [main] }
  workflow_dispatch: {}

permissions: { contents: read, pages: write, id-token: write }

# Queue publishes; never cancel one half-way.
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run demo-smoke
      - run: npm run build
        env:
          # The custom domain, or https://<owner>.github.io/<repo>; the base path follows it.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || steps.pages.outputs.base_url }}
          # Optional repo variables; unset ones fall back to the public testnet defaults.
          VITE_LCD_URL: ${{ vars.VITE_LCD_URL }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_GRASS_URL: ${{ vars.VITE_GRASS_URL }}
          VITE_GUILD_ID: ${{ vars.VITE_GUILD_ID }}
          VITE_MATRIX_HOMESERVER: ${{ vars.VITE_MATRIX_HOMESERVER }}
          VITE_MATRIX_ROOM: ${{ vars.VITE_MATRIX_ROOM }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
